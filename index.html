<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShop - Votre boutique en ligne</title>
    <meta name="description" content="DevShop - Boutique en ligne dynamique avec filtres et panier">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</head>

<body>
    <!-- En-tête -->
    <header class="en-tete">
        <div class="conteneur-header">
            <a href="#" class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 01-8 0" />
                </svg>
                <span>DevShop</span>
            </a>

            <div class="panneau-controle">
                <div class="filtres">
                    <button class="filtre-btn actif" data-categorie="tous">Tous</button>
                    <button class="filtre-btn" data-categorie="electronics">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                            <line x1="16" y1="21" x2="8" y2="21" />
                            <line x1="10" y1="14" x2="14" y2="14" />
                        </svg>
                        Électronique
                    </button>
                    <button class="filtre-btn" data-categorie="jewelery">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <circle cx="12" cy="12" r="6" />
                            <circle cx="12" cy="12" r="2" />
                        </svg>
                        Bijoux
                    </button>
                    <button class="filtre-btn" data-categorie="men's clothing">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 4h-4a2 2 0 00-2 2v12a2 2 0 002 2h4" />
                            <path d="M5 4h4a2 2 0 012 2v12a2 2 0 01-2 2H5" />
                        </svg>
                        Vêtements H
                    </button>
                    <button class="filtre-btn" data-categorie="women's clothing">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="7" r="3" />
                            <path d="M9 10l-1 9h8l-1-9" />
                        </svg>
                        Vêtements F
                    </button>
                </div>

                <div class="recherche-panier">
                    <div class="recherche-wrapper">
                        <svg class="icone-recherche" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input class="recherche-input" type="text" placeholder="Rechercher un produit..."
                            id="rechercheInput">
                    </div>

                    <div class="panier-icone" id="panierIcone">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1" />
                            <circle cx="20" cy="21" r="1" />
                            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                        </svg>
                        <span class="panier-compteur" id="panierCompteur">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Bannière -->
    <section class="banniere">
        <div class="conteneur-banniere">
            <h1>Les meilleurs produits tech</h1>
            <p>Découvrez notre sélection de produits high-tech au meilleur prix</p>
        </div>
    </section>

    <!-- Contenu principal -->
    <main class="conteneur-principal">
        <div id="conteneurProduits" class="grille-produits">
            <div class="loader">
                <div class="spinner"></div>
                <p>Chargement des produits...</p>
            </div>
        </div>
    </main>

    <!-- Tiroir du panier -->
    <div class="panier-tiroir" id="panierTiroir">
        <div class="tiroir-contenu">
            <div class="tiroir-en-tete">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                    </svg>
                    Mon panier
                </h2>
                <button class="fermer-tiroir" id="fermerTiroir">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div id="listeArticlesPanier" class="liste-articles">
                <p class="panier-vide">Votre panier est vide</p>
            </div>

            <div class="tiroir-pied">
                <div class="total-panier" id="totalPanier">
                    <span>Total</span>
                    <span>0,00 €</span>
                </div>
                <button class="btn-commander">Passer la commande</button>
                <button class="btn-vider" id="viderPanier">Vider le panier</button>
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <footer class="pied-page">
        <div class="conteneur-footer">
            <p>Projet d'apprentissage S10</p>
            <p>Projet réalisé pour Akieni Academy</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
